version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: nepali-rag-backend
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./ai:/app/ai
      - /home/an00b/.vespa:/.vespa
    networks:
      - nepali-rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: nepali-rag-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8080
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - ./frontend:/app/frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nepali-rag-network

networks:
  nepali-rag-network:
    driver: bridge
